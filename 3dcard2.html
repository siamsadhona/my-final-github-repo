<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Profile Card</title>
    <link rel="stylesheet" href="styles/3dcard2.css">
</head>
<body>

<div class="card">
    <div class="card-inner">

        <!-- Front Side -->
        <div class="card-front">
            <img src="images/siam.jpeg" alt="siam">

            <h1>Siam</h1>

            <p>I'm a hablu web developer</p>
        </div>

        <!-- Back Side -->
        <div class="card-back">

            <h2>Profile Information</h2>

            <div class="info">
                <p><strong>Name :</strong> Siam</p>
                <p><strong>About :</strong> I'm a hablu web developer</p>
                <p><strong>Class :</strong> 12th</p>
            </div>

            <button>Follow Me</button>

        </div>

    </div>
</div>

</body>
</html>
